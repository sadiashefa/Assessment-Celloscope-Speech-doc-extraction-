services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Single provider switch — mock by default, no credentials required
      PROVIDER: ${PROVIDER:-mock}
      # Secret — only needed when PROVIDER=openrouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Model names
      TRANSCRIPTION_PROVIDER_MODEL: ${TRANSCRIPTION_PROVIDER_MODEL:-google/gemini-2.5-flash}
      DOCUMENT_EXTRACTION_PROVIDER_MODEL: ${DOCUMENT_EXTRACTION_PROVIDER_MODEL:-google/gemma-4-31b-it}
